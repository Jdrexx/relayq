[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "relayq"
version = "0.1.0"
description = "Distributed job queue with Redis Streams transport"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
    "redis[hiredis]>=5.0",
    "prometheus-client>=0.19",
    "fastapi>=0.109",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "hypothesis>=6.92",
    "httpx>=0.26",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests that need Redis (deselect with '-m \"not integration\"')",
]

[tool.coverage.run]
source = ["relayq"]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
fail_under = 70
